<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Resume upload and parser workflow</title>
<desc>Candidate chooses whether to upload a resume. No goes to manual entry. Yes goes through uploader, parser, and a per-field conflict prompt, both paths converging on continuing to profile sections.</desc>
<style>
  text { font-family: Arial, Helvetica, sans-serif; }
  .th { font-size: 14px; font-weight: 700; }
  .ts { font-size: 12px; font-weight: 400; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="240" y="40" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="340" y="62" text-anchor="middle" fill="#04342C">Upload resume?</text>
<text class="ts" x="340" y="80" text-anchor="middle" fill="#085041">Yes / No</text>

<path d="M340 96 L340 118 L190 118 L190 140" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M340 96 L340 118 L490 118 L490 140" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="115" y="140" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="th" x="190" y="166" text-anchor="middle" fill="#2C2C2A">Manual entry</text>

<rect x="415" y="140" width="150" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="490" y="166" text-anchor="middle" fill="#04342C">Uploader</text>

<line x1="490" y1="184" x2="490" y2="220" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="380" y="220" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="th" x="490" y="242" text-anchor="middle" fill="#26215C">Parser</text>
<text class="ts" x="490" y="260" text-anchor="middle" fill="#3C3489">Maps to profile fields</text>

<line x1="490" y1="276" x2="490" y2="310" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="380" y="310" width="220" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text class="th" x="490" y="332" text-anchor="middle" fill="#412402">Conflict prompt</text>
<text class="ts" x="490" y="350" text-anchor="middle" fill="#633806">Change field? Yes / No</text>

<line x1="490" y1="366" x2="490" y2="400" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="390" y="400" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="th" x="490" y="426" text-anchor="middle" fill="#2C2C2A">Continue to sections</text>

<path d="M190 184 L190 460 L320 460 L320 444" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
</svg>
