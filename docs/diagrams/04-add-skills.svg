<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Add skills workflow</title>
<desc>After saving the profile, the candidate adds skills via typeahead, sets years and proficiency and maps to work history, then skills are dynamically grouped, with resume-parsed skills feeding the same form, converging on the editable skill list.</desc>
<style>
  text { font-family: Arial, Helvetica, sans-serif; }
  .th { font-size: 14px; font-weight: 700; }
  .ts { font-size: 12px; font-weight: 400; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="260" y="40" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="th" x="340" y="66" text-anchor="middle" fill="#2C2C2A">Save profile</text>

<line x1="340" y1="84" x2="340" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="250" y="110" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="340" y="132" text-anchor="middle" fill="#04342C">Add skills</text>
<text class="ts" x="340" y="150" text-anchor="middle" fill="#085041">Typeahead entry</text>

<line x1="340" y1="166" x2="340" y2="196" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="220" y="196" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="340" y="218" text-anchor="middle" fill="#04342C">Skill details</text>
<text class="ts" x="340" y="236" text-anchor="middle" fill="#085041">Years, proficiency, mapping</text>

<path d="M340 252 L340 266 L200 266 L200 280" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M340 252 L340 266 L490 266 L490 280" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="90" y="280" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="th" x="200" y="302" text-anchor="middle" fill="#26215C">Dynamic grouping</text>
<text class="ts" x="200" y="320" text-anchor="middle" fill="#3C3489">Auto-categorized by type</text>

<rect x="390" y="280" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="th" x="490" y="302" text-anchor="middle" fill="#4A1B0C">Resume parsing</text>
<text class="ts" x="490" y="320" text-anchor="middle" fill="#712B13">Feeds same form</text>

<path d="M200 336 L200 460 L320 460 L320 446" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M490 336 L490 460 L360 460 L360 446" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="230" y="390" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="th" x="340" y="412" text-anchor="middle" fill="#2C2C2A">Skill list</text>
<text class="ts" x="340" y="430" text-anchor="middle" fill="#444441">Add, edit, delete</text>
</svg>
