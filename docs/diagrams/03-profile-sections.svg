<svg width="680" height="374" viewBox="0 0 680 374" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Profile sections workflow</title>
<desc>Five repeatable profile sections — work experience, education, certifications, external links, and portfolio — each follow the same add, edit, delete pattern and converge into a profile preview.</desc>
<style>
  text { font-family: Arial, Helvetica, sans-serif; }
  .th { font-size: 14px; font-weight: 700; }
  .ts { font-size: 12px; font-weight: 400; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="80" y="40" width="160" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="160" y="66" text-anchor="middle" fill="#04342C">Work experience</text>

<rect x="260" y="40" width="160" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="340" y="66" text-anchor="middle" fill="#04342C">Education</text>

<rect x="440" y="40" width="160" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="520" y="66" text-anchor="middle" fill="#04342C">Certifications</text>

<rect x="180" y="110" width="150" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="255" y="136" text-anchor="middle" fill="#04342C">External links</text>

<rect x="350" y="110" width="150" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="425" y="136" text-anchor="middle" fill="#04342C">Portfolio</text>

<path d="M160 84 L160 170 L340 170 L340 190" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="84" x2="340" y2="190" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M520 84 L520 170 L340 170 L340 190" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M255 154 L255 170 L340 170 L340 190" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M425 154 L425 170 L340 170 L340 190" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="210" y="190" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text class="th" x="340" y="212" text-anchor="middle" fill="#412402">Add / edit / delete</text>
<text class="ts" x="340" y="230" text-anchor="middle" fill="#633806">Repeatable nested entries</text>

<line x1="340" y1="246" x2="340" y2="290" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="250" y="290" width="180" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="th" x="340" y="316" text-anchor="middle" fill="#26215C">Preview profile</text>
</svg>
