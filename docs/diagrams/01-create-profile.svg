<svg width="680" height="314" viewBox="0 0 680 314" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Create profile workflow</title>
<desc>Candidate fills in basic profile fields, then chooses Save and exit or Save and continue, leading to landing page or resume upload.</desc>
<style>
  text { font-family: Arial, Helvetica, sans-serif; }
  .th { font-size: 14px; font-weight: 700; }
  .ts { font-size: 12px; font-weight: 400; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="240" y="40" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="th" x="340" y="62" text-anchor="middle" fill="#26215C">Create profile</text>
<text class="ts" x="340" y="80" text-anchor="middle" fill="#3C3489">Basic profile fields</text>

<path d="M340 96 L340 118 L225 118 L225 140" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M340 96 L340 118 L465 118 L465 140" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="150" y="140" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="th" x="225" y="166" text-anchor="middle" fill="#2C2C2A">Save &amp; exit</text>

<rect x="380" y="140" width="170" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="465" y="166" text-anchor="middle" fill="#04342C">Save &amp; continue</text>

<line x1="225" y1="184" x2="225" y2="230" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="465" y1="184" x2="465" y2="230" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="155" y="230" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="th" x="225" y="256" text-anchor="middle" fill="#2C2C2A">Landing page</text>

<rect x="390" y="230" width="150" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="465" y="256" text-anchor="middle" fill="#04342C">Resume upload</text>
</svg>
